name: Build & Release Standalone Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Install npm dependencies
        working-directory: mobile
        run: npm install

      - name: 🚀 Expo Prebuild
        working-directory: mobile
        run: npx expo prebuild --platform android --clean

      - name: 🔑 Set Permissions & Build Standalone Release APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 📋 Prepare FlatSplit.apk Asset
        run: |
          mkdir -p release-artifacts
          cp mobile/android/app/build/outputs/apk/release/app-release.apk release-artifacts/FlatSplit.apk

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlatSplit-Release-APK
          path: release-artifacts/FlatSplit.apk

      - name: 🏷️ Publish GitHub Release with FlatSplit.apk
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }} - FlatSplit Offline APK
          body: |
            ### 📱 FlatSplit Standalone Android APK (${{ github.ref_name }})
            
            This is the standalone offline APK. You can download and install `FlatSplit.apk` directly onto any Android phone without needing a computer, dev server, or internet connection.
            
            #### ✨ Highlights:
            - **100% Offline-First**: Local SQLite/AsyncStorage storage with debt simplification algorithms.
            - **Instant Vector QR Codes**: Native SVG QR code generation without canvas dependencies.
            - **Built-in Camera QR Scanner**: Fast peer syncing by pointing camera at roommate's screen.
            - **Local Wi-Fi & Hotspot Sync**: Connect & sync across the same network.
            - **Avatar & Name Profile System**: Instant setup with no email/password required.
            
            ---
            ### ⬇️ Direct APK Download:
            Download **`FlatSplit.apk`** under the **Assets** section below.
          files: release-artifacts/FlatSplit.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
